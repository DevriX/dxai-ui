# The checks every push to main and every pull request goes through (docs/PLAN-ARCHITECTURE.md, phase 4).
#   static: every file parses, the PHPCS gate (security, SQL, translations, PHP 8.2+), PHPStan against its baseline, the admin builds.
#   suites: the ci group of bin/suites.json on a clean WordPress (wp-env: the plugin, DX Base, Twenty Twenty-Five), --strict:
#           every suite must run and pass, and a suite file the manifest does not list fails the run.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, PHPCS, PHPStan, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer dev tools
        run: composer install --no-interaction --no-progress

      - name: Every PHP file and script parses
        run: node bin/lint.cjs

      - name: docs/HOOKS.md says what the code fires
        run: node bin/hooks-doc.cjs --check

      - name: PHPCS gate
        run: vendor/bin/phpcs

      - name: PHPStan (new problems only)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: The admin builds
        run: |
          npm ci
          npm run build

      # The ZIP a tag would release, made from what git carries: a file the plugin needs that git does not have fails here,
      # on the push, not on the tag (v0.4.0-beta.34 shipped without the icon runtime, ignored by a `vendor/` rule).
      - name: The release ZIP builds
        run: |
          export DXAI_PHP="$(command -v php)"
          export DXAI_PHP_INI="$(php -r 'echo php_ini_loaded_file();')"
          node bin/release.cjs 0.0.0-ci --no-build

  suites:
    name: Suites on a clean site (wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WP_ENV: npx --yes @wordpress/env@11.16.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Some suites call the site over HTTP from the CLI container, where localhost:8888 (the runner's port) is no site: there the
      # site is the WordPress container, so its address is that container's name. Only CI's development site is told so.
      - name: The site's address, as the CLI container reaches it
        run: |
          cat > .wp-env.override.json <<'JSON'
          { "env": { "development": { "config": { "WP_HOME": "http://wordpress", "WP_SITEURL": "http://wordpress" } } } }
          JSON
          cat .wp-env.override.json

      - name: Start WordPress
        run: $WP_ENV start

      # The suites write the fixture archives into .verify/ of the plugin, which the CLI container sees mounted.
      - name: A folder the container may write
        run: mkdir -p .verify && chmod 0777 .verify

      # DX Base installed by the plugin itself, a folder of the site's own as a person's install makes it (a mount of
      # themes/dx-base would be the plugin's own files: the suite that installs it would copy them onto themselves).
      - name: DX Base, installed by the plugin
        run: $WP_ENV run cli --env-cwd=wp-content/plugins/dxai-ui wp dxai-ui base-theme install

      - name: The ci group, strict
        run: node bin/run-suites.cjs --wp "$WP_ENV run cli --env-cwd=wp-content/plugins/dxai-ui wp" --group ci --strict --json suites.json

      - name: The report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suites-report
          path: suites.json
          if-no-files-found: ignore
